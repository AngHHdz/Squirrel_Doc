name: Validate Squirrel Doc
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required web files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s assets/mascot.png
